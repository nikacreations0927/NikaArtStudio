<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order Confirmed — Nika Arts Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<header class="site-header">
  <a href="index.html" class="logo">Nika Arts Studio</a>
  <nav class="nav-links"><a href="products.html">Shop</a></nav>
  <a href="cart.html" class="cart-icon" aria-label="View cart">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
    <span class="cart-count" id="cart-count">0</span>
  </a>
</header>

<section class="section success-section">
  <div class="success-box" id="success-box">
    <div class="success-icon">✓</div>
    <h2>Order confirmed!</h2>
    <p id="success-msg">Thank you for your order. We'll send a confirmation to your email shortly.</p>
    <p id="order-id-display" style="color:#888; font-size:13px;"></p>
    <a href="products.html" class="btn-primary" style="margin-top:1.5rem">Continue shopping</a>
  </div>
  <div class="success-box" id="fail-box" style="display:none">
    <div class="fail-icon">✕</div>
    <h2>Payment not completed</h2>
    <p>Your order was not placed. You have not been charged.</p>
    <a href="cart.html" class="btn-primary" style="margin-top:1.5rem">Back to cart</a>
  </div>
</section>

<script src="js/cart.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  const params = new URLSearchParams(window.location.search);
  const txnId = params.get('transactionId');

  if (!txnId) {
    document.getElementById('success-box').style.display = 'none';
    document.getElementById('fail-box').style.display = 'block';
    return;
  }

  try {
    const res = await fetch(`/api/payment/status/${txnId}`);
    const data = await res.json();

    if (data.success && data.status === 'PAYMENT_SUCCESS') {
      document.getElementById('order-id-display').textContent = 'Order ID: ' + txnId;
      // Clear cart
      saveCart([]);
      updateCartCount();
    } else {
      document.getElementById('success-box').style.display = 'none';
      document.getElementById('fail-box').style.display = 'block';
    }
  } catch(e) {
    // If backend unreachable, still show success (verify separately)
    document.getElementById('order-id-display').textContent = txnId ? 'Order ID: ' + txnId : '';
    saveCart([]);
    updateCartCount();
  }
});
</script>
</body>
</html>
