<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order Received - Nika Arts Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=discounts-1" />
</head>
<body>
<header class="site-header">
  <a href="/" class="logo">Nika Arts Studio</a>
  <nav class="nav-links"><a href="/shop">Shop</a><a href="/track-order">Track Order</a><a href="/account">Account</a></nav>
  <a href="/cart" class="cart-icon" aria-label="View cart">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
    <span class="cart-count" id="cart-count">0</span>
  </a>
</header>

<section class="section success-section">
  <div class="success-box" id="success-box">
    <div class="success-icon">✓</div>
    <h2 id="success-title">Order received</h2>
    <p id="success-msg">Thank you for your order.</p>
    <p id="order-id-display" style="color:#888; font-size:13px;"></p>
    <p id="next-discount-message" class="field-note" style="margin-top:0.75rem;"></p>
    <div class="success-actions" id="success-actions"></div>
    <a href="/shop" class="btn-primary" style="margin-top:1.5rem">Continue shopping</a>
  </div>
  <div class="success-box" id="fail-box" style="display:none">
    <div class="fail-icon">x</div>
    <h2>Order not found</h2>
    <p>We could not find this order. Please try again from the cart or track order page.</p>
    <a href="/cart" class="btn-primary" style="margin-top:1.5rem">Back to cart</a>
  </div>
</section>

<script src="js/site-assets.js?v=site-assets-1"></script>
<script src="js/cart.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  const params = new URLSearchParams(window.location.search);
  const txnId = params.get('transactionId');
  const isPrebook = params.get('prebook') === '1';

  if (!txnId) {
    showFailure();
    return;
  }

  try {
    const res = await fetch(`/api/payment/status/${encodeURIComponent(txnId)}`);
    const data = await res.json();
    if (!res.ok || !data.success) throw new Error(data.message || 'Could not verify order.');

    const isPaid = ['PAID', 'PAYMENT_SUCCESS'].includes(data.status);
    document.getElementById('success-title').textContent = isPaid ? 'Order confirmed!' : isPrebook ? 'Pre-book received!' : 'Order received!';
    document.getElementById('success-msg').textContent = isPaid
      ? 'Your payment has been verified and your order is confirmed.'
      : isPrebook
        ? 'Your advance payment reference has been submitted. We will verify it and notify you when stock is ready for the remaining payment.'
        : 'Your UPI reference has been submitted. We will verify the payment and then prepare your order.';
    document.getElementById('order-id-display').textContent = 'Order ID: ' + txnId;
    document.getElementById('next-discount-message').textContent = data.nextDiscountMessage || '';
    document.getElementById('success-actions').innerHTML = `<a href="/track-order?order=${encodeURIComponent(txnId)}" class="btn-outline" style="margin-top:1rem">Track this order</a>`;
    saveCart([]);
    updateCartCount();
  } catch(e) {
    showFailure();
  }
});

function showFailure() {
  document.getElementById('success-box').style.display = 'none';
  document.getElementById('fail-box').style.display = 'block';
}
</script>
</body>
</html>
