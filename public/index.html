<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nika Arts Studio</title>
  <meta property="og:title" content="Nika Arts Studio | Handcrafted Art & Collectibles" />
  <meta property="og:description" content="Discover beautiful, handcrafted crochet pieces, resin art, and unique collectibles created with intention." />
  
  <meta property="og:image" content="https://yourdomain.com/images/hero.jpg" data-site-asset="logoImage" /> 
  <meta property="og:url" content="https://yourdomain.com" />
  <meta property="og:type" content="website" />
  
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Nika Arts Studio" />
  <meta name="twitter:description" content="Handcrafted Art & Collectibles." />
  <meta name="twitter:image" content="https://yourdomain.com/images/hero.jpg" data-site-asset="logoImage" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=site-assets-1" />
</head>
<body>

<header class="site-header">
  <a href="/" class="logo">Nika Arts Studio</a>
  <nav class="nav-links">
    <a href="/shop">Shop</a>
    <a href="#about">About</a>
    <a href="#contact">Contact</a>
    <a href="/track-order">Track Order</a>
    <a href="/account">Account</a>
  </nav>
  <a href="/cart" class="cart-icon" aria-label="View cart">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
    <span class="cart-count" id="cart-count">0</span>
  </a>
</header>

<section class="hero home-hero">
  <div class="hero-content">
    <p class="hero-eyebrow" id="hero-eyebrow"></p>
    <h1 id="hero-title"></h1>
    <p class="hero-sub" id="hero-subtitle"></p>
    <a href="/shop" class="btn-primary">Explore the collection</a>
  </div>
  <div class="hero-media">
    <img src="images/hero.jpg" alt="Nika Arts Studio" data-site-asset="logoImage" />
  </div>
</section>

<section class="section" id="featured">
  <div class="section-header">
    <h2>Featured pieces</h2>
    <a href="/shop" class="link-subtle">View all →</a>
  </div>
  <div class="product-grid" id="featured-grid"></div>
</section>

<section class="section about-section" id="about">
  <div class="about-text reveal">
    <p class="eyebrow" id="about-eyebrow"></p>
    <h2 id="about-title"></h2>
    <p id="about-p1"></p>
    <p id="about-p2"></p>
  </div>
  <div class="about-image reveal" style="transition-delay: 0.2s;">
    <img src="images/ArtistPhoto.jpeg" alt="Nika Arts Studio Artist" data-site-asset="artistImage" />
  </div>
</section>

<section class="section" id="contact">
  <div class="contact-box reveal">
    <h2 id="contact-title"></h2>
    <p id="contact-desc"></p>
    <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
      <a href="" id="contact-email-btn" class="btn-outline"></a>
      <a href="" id="contact-phone-btn" class="btn-outline"></a>
    </div>
  </div>
</section>

<footer class="site-footer">
  <p>© 2025 Nika Arts Studio. All rights reserved.</p>
  <div class="footer-links">
    <a href="/privacy">Privacy Policy</a>
    <a href="/shipping">Shipping Policy</a>
    <a href="/returns">Returns</a>
  </div>
</footer>

<script src="js/site-assets.js?v=site-assets-1"></script>
<script src="js/cart.js"></script>

<script>
  let SITE_CONTENT = {};

  function populateContent() {
    // Hero
    document.getElementById('hero-eyebrow').textContent = SITE_CONTENT.hero.eyebrow;
    document.getElementById('hero-title').innerHTML = SITE_CONTENT.hero.title; 
    document.getElementById('hero-subtitle').textContent = SITE_CONTENT.hero.subtitle;

    // About
    document.getElementById('about-eyebrow').textContent = SITE_CONTENT.about.eyebrow;
    document.getElementById('about-title').textContent = SITE_CONTENT.about.title;
    document.getElementById('about-p1').textContent = SITE_CONTENT.about.paragraph1;
    document.getElementById('about-p2').textContent = SITE_CONTENT.about.paragraph2;

    // Contact
    document.getElementById('contact-title').textContent = SITE_CONTENT.contact.title;
    document.getElementById('contact-desc').textContent = SITE_CONTENT.contact.description;
    
    // Contact Buttons
    const emailBtn = document.getElementById('contact-email-btn');
    emailBtn.textContent = SITE_CONTENT.contact.email;
    emailBtn.href = `mailto:${SITE_CONTENT.contact.email}`;

    const phoneBtn = document.getElementById('contact-phone-btn');
    phoneBtn.textContent = SITE_CONTENT.contact.phoneDisplay;
    phoneBtn.href = `tel:${SITE_CONTENT.contact.phoneLink}`;
  }

  document.addEventListener('DOMContentLoaded', async () => {
    // 1. Fetch the dynamic content from the database
    try {
      const response = await fetch('/api/content');
      const data = await response.json();
      if (data.success && data.content) {
        SITE_CONTENT = data.content;
        if (window.applySiteAssets) window.applySiteAssets(SITE_CONTENT);
        populateContent();
      }
    } catch (err) {
      console.error("Failed to load site content from database.", err);
    }
    
    // 2. Load the rest of the store
    updateCartCount();
    await loadProducts();
    const featured = PRODUCTS.slice(0, 4);
    const grid = document.getElementById('featured-grid');
    if (grid) {
      grid.innerHTML = featured.map(productCard).join('');
    }

    // 3. START PREMIUM SCROLL ANIMATIONS
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          // Add the active class when the element enters the screen
          entry.target.classList.add('active');
          // Stop observing it so it doesn't animate out and in repeatedly
          observer.unobserve(entry.target); 
        }
      });
    }, { 
      threshold: 0.15, // Triggers when 15% of the item is visible
      rootMargin: "0px 0px -50px 0px" // Triggers slightly before it hits the bottom of the screen
    });

    // Find everything with the 'reveal' class and watch it
    document.querySelectorAll('.reveal, .product-card').forEach((el) => {
      // Automatically add 'reveal' class to product cards so they float up too!
      if(el.classList.contains('product-card')) el.classList.add('reveal');
      observer.observe(el);
    });
  });
</script>
</body>
</html>
