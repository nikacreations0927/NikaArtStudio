<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - Nika Arts Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=prebook-1" />
</head>
<body>
<header class="site-header">
  <a href="/" class="logo">Nika Arts Studio</a>
  <nav class="nav-links">
    <a href="/shop">Shop</a>
    <a href="/admin" class="active">Admin</a>
  </nav>
</header>

<div class="page-hero-small">
  <h1>Store Admin</h1>
  <p>Manage products, stock, sales, and logistics</p>
</div>

<section class="section admin-section">
  <div class="admin-toolbar">
    <label>Username <input type="text" id="admin-username" placeholder="Admin username" autocomplete="username" /></label>
    <label>Password <input type="password" id="admin-password" placeholder="Admin password" autocomplete="current-password" /></label>
    <button class="btn-primary" onclick="saveAdminLogin()">Log in</button>
    <button class="btn-outline" onclick="clearAdminLogin()">Log out</button>
    <span id="admin-session-status" class="admin-session-status">Checking session...</span>
  </div>
  
  <div id="admin-message" class="admin-message"></div>

  <div class="admin-tabs" style="display: flex; gap: 1rem; margin-bottom: 2rem; border-bottom: 1px solid var(--border); padding-bottom: 1rem;">
    <button id="tab-dashboard" class="btn-outline" style="border:none;" onclick="switchTab('dashboard')">Dashboard & Sales</button>
    <button id="tab-inventory" class="btn-outline" style="border:none;" onclick="switchTab('inventory')">Inventory Management</button>
    <button id="tab-cms" class="btn-outline" style="border:none;" onclick="switchTab('cms')">Site Content (CMS)</button>
    <button id="tab-settings" class="btn-outline" style="border:none;" onclick="switchTab('settings')">Settings</button>
  </div>

  <div id="admin-content">
    <p style="text-align: center; color: #666; margin-top: 2rem;">Please log in or select a tab to view data.</p>
  </div>

</section>

<div class="admin-modal-backdrop" id="admin-confirm-modal" hidden>
  <div class="admin-modal" role="dialog" aria-modal="true" aria-labelledby="admin-confirm-title">
    <h3 id="admin-confirm-title">Remove product?</h3>
    <p id="admin-confirm-body">This action cannot be undone.</p>
    <div class="admin-modal-actions">
      <button class="btn-outline" type="button" id="admin-confirm-cancel">Cancel</button>
      <button class="btn-primary danger" type="button" id="admin-confirm-ok">Remove</button>
    </div>
  </div>
</div>

<div class="admin-modal-backdrop" id="product-editor-modal" hidden>
  <div class="admin-modal product-editor-modal" role="dialog" aria-modal="true" aria-labelledby="product-editor-title">
    <div class="panel-heading">
      <h3 id="product-editor-title">Edit Product</h3>
      <button class="btn-outline small-btn" type="button" onclick="closeProductEditor()">Close</button>
    </div>
    <div class="product-editor-grid">
      <div class="product-editor-photo">
        <img id="edit-product-image-preview" alt="Product preview" />
        <div id="edit-product-image-empty">No photo</div>
        <input id="edit-product-image-file" type="file" accept="image/png,image/jpeg,image/webp" />
      </div>
      <form class="product-editor-form" onsubmit="saveProductFromEditor(event)">
        <input id="edit-product-id" type="hidden" />
        <label>Name <input id="edit-product-name" required /></label>
        <label>Category <select id="edit-product-category"></select></label>
        <label>Description <textarea id="edit-product-description" rows="3"></textarea></label>
        <div class="form-row two-col">
          <label>Price <input id="edit-product-price" type="number" min="0" required /></label>
          <label>Stock <input id="edit-product-stock" type="number" min="0" required /></label>
        </div>
        <label>Status
          <select id="edit-product-active">
            <option value="true">Live</option>
            <option value="false">Hidden</option>
          </select>
        </label>
        <div class="form-row two-col">
          <label>Colour choices?
            <select id="edit-product-has-colors" onchange="toggleEditColorOptions()">
              <option value="no">No</option>
              <option value="yes">Yes</option>
            </select>
          </label>
          <label id="edit-product-colors-label">Available colours
            <textarea id="edit-product-color-options" rows="3" placeholder="One per line: Yellow | Cloudinary image URL"></textarea>
          </label>
        </div>
        <label>Image URL <input id="edit-product-image-url" readonly /></label>
        <div class="admin-modal-actions">
          <button class="btn-outline" type="button" onclick="closeProductEditor()">Cancel</button>
          <button class="btn-primary" type="submit">Save Changes</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="js/site-assets.js?v=site-assets-1"></script>
<script src="js/admin.js?v=admin-dashboard-orders-1"></script>
</body>
</html>
